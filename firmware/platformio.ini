[platformio]
default_envs = es3c28p

; Starter project for the LCDwiki 2.8" ESP32-S3 display (ES3C28P / ES3N28P)
; ESP32-S3 N16R8: 16 MB QIO flash + 8 MB octal PSRAM, native USB-Serial/JTAG.
;
; Uses the community "pioarduino" platform (Arduino-ESP32 core 3.x). The official
; `platform = espressif32` also works but ships the older core 2.x.

[env:es3c28p]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip   ; Arduino core 3.3.12 (pinned: core 4.x breaks NimBLE-Arduino)
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi   ; QIO flash + OPI (octal) PSRAM
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv   ; 2x 6.5MB app (OTA) + 3.4MB SPIFFS

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1          ; USB-Serial/JTAG (hardware CDC)
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial -> USB port, not UART0 pins

lib_deps =
    lovyan03/LovyanGFX@^1.2.7
    adafruit/Adafruit NeoPixel@^1.12.3
    h2zero/NimBLE-Arduino@^2.5.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -g -fsanitize=address,undefined -fno-omit-frame-pointer
extra_scripts = post:asan_link.py
lib_compat_mode = off
test_filter = test_*

[env:demo]
extends = env:es3c28p
build_flags = ${env:es3c28p.build_flags} -DDEMO=1
